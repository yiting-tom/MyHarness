[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myharness"
version = "0.1.0"
description = "Multi-agent data-analysis harness on claude-agent-sdk, exposed as an MCP server"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.139",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "psutil>=6"]

[tool.hatch.build.targets.wheel]
packages = ["myharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits a real model API; costs money and needs a key in .env. Run with -m live.",
]
filterwarnings = ["error::DeprecationWarning:myharness.*"]
