[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myharness"
version = "0.1.0"
description = "Multi-agent data-analysis harness on claude-agent-sdk, exposed as an MCP server"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.139",
    "duckdb>=1.5",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "psutil>=6",
    "ruff>=0.16", "mypy>=1.11", "types-jsonschema", "types-protobuf",
]
# The A2A boundary is the second way in, and it is the only one that needs an
# HTTP server. Someone who only speaks MCP over stdio should not have to install
# starlette to get it (expose-over-a2a D6). The http-server extra is the narrow
# one: no grpc, no sqlalchemy, no fastapi.
a2a = ["a2a-sdk[http-server]>=1.1.2", "uvicorn>=0.30"]

[project.scripts]
myharness = "myharness.monitor.cli:main"
myharness-mcp = "myharness.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["myharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits a real model API; costs money and needs a key in .env. Run with -m live.",
]
filterwarnings = ["error::DeprecationWarning:myharness.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM", "RET", "RUF"]
# 這個 repo 的註解、charter 與測試名稱是中文，全形標點是內容，不是打錯的半形。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# spikes/ 是已經結案的實驗，結論寫在 spikes/RESULTS.md。它們的價值在於忠實記錄
# 當時跑了什麼，不在於好看——整理它們只會讓紀錄與當時執行的東西不一致。所以這裡
# 只查真的會出事的那一類（F：未定義的名字、沒用到的 import），風格一概不管。
"spikes/*" = ["E", "W", "B", "BLE", "C4", "SIM", "RET", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
# 只查 myharness/。tests/ 在 strict 下有 1158 個錯，幾乎全是 pytest 慣用的無註記
# 測試函式；把它們標完不會抓到任何東西，只會讓測試更難寫。
files = ["myharness"]
# strict 從一開始就是可以做到的：這個 repo 本來就標得很完整，全開只差 41 個地方。
# 放著不開，每個新函式都可以悄悄不帶註記進來。
strict = true
