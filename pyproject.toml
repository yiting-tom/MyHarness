[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myharness"
version = "0.1.0"
description = "Multi-agent data-analysis harness on claude-agent-sdk, exposed as an MCP server"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["myharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:myharness.*"]
